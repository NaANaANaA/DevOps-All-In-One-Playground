---
- name: Validate prerequisites and deploy Kubernetes starter
  hosts: local
  gather_facts: false
  vars:
    deploy_namespace: example-app
    manifests_dir: "{{ playbook_dir }}/../k8s/app"
  tasks:
    - name: Check kubectl is available
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: Check current kubectl context
      ansible.builtin.command: kubectl config current-context
      changed_when: false

    - name: Render manifests locally
      ansible.builtin.command:
        cmd: kubectl kustomize {{ manifests_dir }}
      register: rendered_manifests
      changed_when: false

    - name: Ensure rendered manifests do not contain Namespace objects
      ansible.builtin.assert:
        that:
          - "'kind: Namespace' not in rendered_manifests.stdout"
        fail_msg: "Use a namespace-free kustomization because this playbook creates the namespace separately."

    - name: Ensure namespace exists
      ansible.builtin.command:
        cmd: kubectl create namespace {{ deploy_namespace }} --dry-run=client -o yaml
      register: namespace_yaml
      changed_when: false

    - name: Apply namespace manifest
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: "{{ namespace_yaml.stdout }}"
      changed_when: false

    - name: Deploy application manifests
      ansible.builtin.command: kubectl apply -n {{ deploy_namespace }} -f -
      args:
        stdin: "{{ rendered_manifests.stdout }}"

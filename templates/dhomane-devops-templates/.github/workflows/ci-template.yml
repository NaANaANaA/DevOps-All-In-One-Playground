name: Template CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/example-org/example-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Install YAML parser
        run: python -m pip install --upgrade pip PyYAML

      - name: Lint shell
        run: ./scripts/validate-shell.sh

      - name: Validate YAML
        run: ./scripts/validate-yaml.sh

      - name: Validate Terraform
        run: ./scripts/validate-terraform.sh

      - name: Render Kubernetes starter
        run: ./scripts/validate-kubernetes.sh

      - name: Run repository checks
        run: ./scripts/validate-workflows.sh

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          docker build -t "$IMAGE_NAME:${{ github.sha }}" .

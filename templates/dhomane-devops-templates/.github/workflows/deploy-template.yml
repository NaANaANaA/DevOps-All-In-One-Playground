name: Reusable Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment name
        required: true
        type: string
      namespace:
        description: Kubernetes namespace to deploy into
        required: true
        type: string
      manifests_path:
        description: Path to a namespace-free Kubernetes kustomization
        required: true
        type: string
      deployment_name:
        description: Deployment resource name to patch and watch
        required: true
        type: string
      container_name:
        description: Container name within the deployment to update
        required: true
        type: string
      image:
        description: Container image reference to inject during deployment
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Render manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize "${{ inputs.manifests_path }}" > /tmp/rendered-manifests.yaml
          if grep -Eq '^[[:space:]]*kind:[[:space:]]*Namespace[[:space:]]*$' /tmp/rendered-manifests.yaml; then
            echo "manifests_path must exclude Namespace objects because this workflow creates the namespace separately" >&2
            exit 1
          fi

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --dry-run=client -n "${{ inputs.namespace }}" -f /tmp/rendered-manifests.yaml

      - name: Deploy manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "${{ inputs.namespace }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "${{ inputs.namespace }}" -f /tmp/rendered-manifests.yaml
          kubectl -n "${{ inputs.namespace }}" set image deployment/${{ inputs.deployment_name }} "${{ inputs.container_name }}=${{ inputs.image }}"
          kubectl -n "${{ inputs.namespace }}" rollout status deployment/${{ inputs.deployment_name }} --timeout=180s

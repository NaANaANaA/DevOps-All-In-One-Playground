apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-app
  namespace: example-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443

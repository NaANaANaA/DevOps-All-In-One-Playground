name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML ansible-core

      - name: Validate shell scripts
        run: ./scripts/validate-shell.sh

      - name: Validate YAML files
        run: ./scripts/validate-yaml.sh

      - name: Validate Terraform formatting
        run: ./scripts/validate-terraform.sh

      - name: Render Kubernetes starter
        run: ./scripts/validate-kubernetes.sh

      - name: Validate workflow structure
        run: ./scripts/validate-workflows.sh

      - name: Validate Ansible syntax
        run: ansible-playbook -i templates/dhomane-devops-templates/ansible/inventory.ini templates/dhomane-devops-templates/ansible/deploy-k8s.yml --syntax-check

      - name: Build sample container
        run: docker build -t playground-sample-app ./templates/alberto-realworld/sample-app
